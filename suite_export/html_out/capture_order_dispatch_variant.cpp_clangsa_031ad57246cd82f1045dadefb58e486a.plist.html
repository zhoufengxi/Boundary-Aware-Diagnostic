      .severity-low {
  background-color: #669603;
}

.severity-low:after {
  content : 'L';
}

.severity-unspecified {
  background-color: #666666;
}

.severity-unspecified:after {
  content : 'U';
}

.severity-style {
  background-color: #9932cc;
}

.severity-style:after {
  content : 'S';
}

.severity-medium {
  background-color: #a9d323;
  color: black;
}

.severity-medium:after {
  content : 'M';
}

.severity-high {
  background-color: #ffa800;
}

.severity-high:after {
  content : 'H';
}

.severity-critical {
  background-color: #e92625;
}

.severity-critical:after {
  content : 'C';
}

i[class*="severity-"] {
  line-height: normal;
  text-transform: capitalize;
  font-size: 0.8em;
  font-weight: bold;
  color: white;
  display: inline-block;
  width: 16px;
  height: 16px;
  text-align: center;
  font-family: sans-serif;
}

      html, body {
  width: 100%;
  height: 100%;
  padding: 0px;
  margin: 0px;
}

div.container {
  padding: 10px;
}

#content {
  height: 100%;
  display: block;
  overflow: hidden;
}

#content > div {
  margin: 10px;
  border: 1px solid #ddd;
  border-radius: 3px;
  height: 97%;
}

#side-bar {
  overflow: auto;
}

#editor-wrapper {
  overflow: hidden;
}

.button {
  background-color: #f1f1f1;
  text-decoration: none;
  display: inline-block;
  padding: 8px 16px;
  color: black;
  cursor: pointer;
}

.button:hover {
  background-color: #ddd;
  color: black;
}

.review-status {
  color: white;
  text-align: center;
}

.review-status-confirmed {
  background-color: #e92625;
}

.review-status-false-positive {
  background-color: grey;
}

.review-status-intentional {
  background-color: #669603;
}

      div.container {
  width: 100%;
  height: 100%;
  padding: 0px;
}

#editor-wrapper {
  margin: 10px;
}

#side-bar {
  float: left;
  width: 260px;
  margin: 0px;
}

#report-nav ul {
  list-style-type: none;
  padding: 0;
  margin: 0;
  overflow-y: auto;
  height: 100%;
}

#report-nav ul > li {
  padding: .4em;
  background-color: #fff;
  border-bottom: 1px solid rgba(0,0,0,.125);
  text-align: left;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

#report-nav ul > li.active {
  background-color: #427ea9;
  color: white;
}

#report-nav ul > li:hover {
  background-color: #427ea9;
  color: white;
  cursor: pointer;
}

#report-nav ul a {
  text-decoration: none;
}

#report-nav i[class*="severity-"] {
  margin-right: 5px;
}

.header {
  border-bottom: 1px solid lightgrey;
  font-family: monospace;
  padding: 10px;
  background-color: #fafbfc;
  border-bottom: 1px solid #e1e4e8;
  border-top-left-radius: 2px;
  border-top-right-radius: 2px;
}

#report-nav .header {
  font-weight: bold;
}

#editor-wrapper .header > div {
  padding-top: 2px;
}

#file-path,
#checker-name {
  color: #195ea2;
}

#review-status {
  padding: 0px 5px;
}

#file-path {
  font-family: monospace;
}

.check-msg {
  display: inline-block;
  padding: 3px 6px;
  margin: 1px;
  -webkit-border-radius: 5px;
  -moz-border-radius: 5px;
  border-radius: 5px;
}

.check-msg.info {
  color: #00546f;
  background-color: #bfdfe9;
  border: 1px solid #87a8b3;
}

.check-msg.error {
  background-color: #f2dede;
  color: #a94442;
  border: 1px solid #ebcccc;
}

.check-msg.macro {
  background-color: #d7dac2;
  color: #4f5c6d;
  border: 1px solid #d7dac2;
}

.check-msg.note {
  background-color: #d7d7d7;
  color: #4f5c6d;
  border: 1px solid #bfbfbf;
}

.check-msg.current {
  border: 2px dashed #3692ff;
}

.check-msg .tag {
  padding: 1px 5px;
  text-align: center;
  border-radius: 2px;
  margin-right: 5px;
  text-decoration: inherit;
}

.check-msg .tag.macro {
  background-color: #83876a;
  color: white;
  text-transform: capitalize;
}

.check-msg .tag.note {
  background-color: #9299a1;
  color: white;
  text-transform: capitalize;
}

.checker-enum {
  color: white;
  padding: 1px 5px;
  text-align: center;
  border-radius: 25px;
  margin-right: 5px;
  text-decoration: inherit;
}

.checker-enum.info {
  background-color: #427ea9;
}

.checker-enum.error {
  background-color: #a94442;
}

.arrow {
  border: solid black;
  border-width: 0 3px 3px 0;
  display: inline-block;
  padding: 3px;
  cursor: pointer;
  margin: 0px 5px;
}

.arrow:hover {
  border: solid #437ea8;
  border-width: 0 3px 3px 0;
}

.left-arrow {
  transform: rotate(135deg);
  -webkit-transform: rotate(135deg);
}

.right-arrow {
  transform: rotate(-45deg);
  -webkit-transform: rotate(-45deg);
}

var BugViewer = {
  _files : [],
  _reports : [],
  _lineWidgets : [],
  _navigationMenuItems : [],
  _sourceFileData : null,
  _currentReport : null,
  _lastBugEvent  : null,

  init : function (files, reports) {
    this._files = files;
    this._reports = reports;

    this.initEscapeChars();
  },

  initEscapeChars : function () {
    this.escapeChars = {
      ' ' : 'nbsp',
      '<' : 'lt',
      '>' : 'gt',
      '"' : 'quot',
      '&' : 'amp'
    };

    var regexString = '[';
    for (var key in this.escapeChars) {
      regexString += key;
    }
    regexString += ']';

    this.escapeRegExp = new RegExp( regexString, 'g');
  },

  escapeHTML : function (str) {
    var that = this;

    return str.replace(this.escapeRegExp, function (m) {
      return '&' + that.escapeChars[m] + ';';
    });
  },

  initByUrl : function () {
    if (!this._reports) return;

    var state = {};
    window.location.hash.substr(1).split('&').forEach(function (s) {
      var parts = s.split('=');
      state[parts[0]] = parts[1];
    });

    for (var key in this._reports) {
      var report = this._reports[key];
      if (report.reportHash === state['reportHash']) {
        this.navigate(report);
        return;
      }
    }

    this.navigate(this._reports[0]);
  },

  create : function () {
    this._content = document.getElementById('editor-wrapper');
    this._filepath = document.getElementById('file-path');
    this._checkerName = document.getElementById('checker-name');
    this._reviewStatusWrapper =
      document.getElementById('review-status-wrapper');
    this._reviewStatus = document.getElementById('review-status');
    this._editor = document.getElementById('editor');

    this._codeMirror = CodeMirror(this._editor, {
      mode: 'text/x-c++src',
      matchBrackets : true,
      lineNumbers : true,
      readOnly : true,
      foldGutter : true,
      extraKeys : {},
      viewportMargin : 100
    });

    this._createNavigationMenu();
  },

  navigate : function (report, item) {
    if (!item) {
      var items = this._navigationMenuItems.filter(function (navItem) {
        return navItem.report.reportHash === report.reportHash;
      });

      if (!items.length) return;

      item = items[0].widget;
    }

    this._selectedReport.classList.remove('active');
    this._selectedReport = item;
    this._selectedReport.classList.add('active');
    this.setReport(report);
  },

  _createNavigationMenu : function () {
    var that = this;

    var nav = document.getElementById('report-nav');
    var list = document.createElement('ul');
    this._reports.forEach(function (report) {
      var events = report.events;
      var lastBugEvent = events[events.length - 1];
      var item = document.createElement('li');

      var severity = document.createElement('i');
      severity.className = 'severity-' + report.severity.toLowerCase();

      item.appendChild(severity);
      item.appendChild(document.createTextNode(report.message));

      item.addEventListener('click', function () {
        that.navigate(report, item);
      })
      list.appendChild(item);
      that._navigationMenuItems.push({ report : report, widget : item });
    });

    if (!this._selectedReport && list.childNodes.length) {

  },

  setReport : function (report) {

    var lastBugEvent = events[events.length - 1];
    this.setCurrentBugEvent(lastBugEvent, events.length - 1);
    this.setChecker(report.checker);
    this.setReviewStatus(report.reviewStatus);

    window.location.hash = '#reportHash=' + report.reportHash;
  },

  setCurrentBugEvent : function (event, idx) {
    this._currentBugEvent = event;
    this.setSourceFileData(this._files[event.fileId]);
    this.drawBugPath();

    this.highlightBugEvent(idx);
  },

  highlightBugEvent : function (idx) {
    this._lineWidgets.forEach(function (widget) {

      }
    });
  },

  setChecker : function (checker) {
    var content = checker.name;

    this._checkerName.innerHTML = content;
  },

  setReviewStatus : function (status) {

  },

  setSourceFileData : function (file) {

  _refresh : function () {

  },

  clearBubbles : function () {
    this._lineWidgets.forEach(function (widget) { widget.clear(); });

  },

  getMessage : function (event, kind) {

      return '<span class="tag macro">' + name + '</span>'
        + this.escapeHTML(event.message).replace(/(?:\r\n|\r|\n)/g, '<br>');
    } else if (kind === 'note') {

        +  this.escapeHTML(event.message).replace(/(?:\r\n|\r|\n)/g, '<br>');
    }
  },

  addExtraPathEvents : function (events, kind) {

      element.setAttribute('style', 'margin-left: ' + left);
      element.setAttribute('class', 'check-msg ' + kind);

      var msg = document.createElement('span');

  },

  renderMainWarning : function (currentEvents) {

      lastEvent.line != this._currentReport.line) {
      return true;
    }

    return false;

  drawBugPath : function () {

        prevBug.addEventListener('click', function () {
          var event = currentEvents[prevBugEvent];
          that.setCurrentBugEvent(event, prevBugEvent);
        });
        element.appendChild(prevBug);
      }

      var msg = document.createElement('span');
      msg.innerHTML = that.escapeHTML(event.message)
        .replace(/(?:\r\n|\r|\n)/g, '<br>');

      element.appendChild(msg);

      var nextBugEvent = step + 1;
      if (nextBugEvent < currentEvents.length) {
        var nextBug = document.createElement('span');
        nextBug.setAttribute('class', 'arrow right-arrow');
        nextBug.addEventListener('click', function () {
          var event = currentEvents[nextBugEvent];
          that.setCurrentBugEvent(event, nextBugEvent);
        });
        element.appendChild(nextBug);
      }

        event.line - 1, element));

    // the main warning message we print the warning message as a separate
    // error node.

      var left = lastEvent ? that._codeMirror.defaultCharWidth() * lastEvent.column + 'px' : '0px';
      element.setAttribute('style', 'margin-left: ' + left);
      element.setAttribute('class', 'check-msg ' + "error");
      var error_tag = document.createElement('span');
      error_tag.setAttribute('class', 'checker-enum error');
      error_tag.innerHTML = "E";
      element.appendChild(error_tag);
      var msg = document.createElement('span');
      msg.innerHTML = that.escapeHTML(this._currentReport.message)
        .replace(/(?:\r\n|\r|\n)/g, '<br>');
      element.appendChild(msg);
      that._lineWidgets.push(that._codeMirror.addLineWidget(
        this._currentReport.line - 1, element));
    }
  },

  jumpTo : function (line, column) {
    var that = this;

    setTimeout(function () {
      var selPosPixel
        = that._codeMirror.charCoords({ line : line, ch : column }, 'local');
      var editorSize = {
        width  : that._editor.clientWidth,
        height : that._editor.clientHeight
      };

      that._codeMirror.scrollIntoView({
        top    : selPosPixel.top - 100,
        bottom : selPosPixel.top + editorSize.height - 150,
        left   : selPosPixel.left < editorSize.width - 100
               ? 0
               : selPosPixel.left - 50,
        right  : selPosPixel.left < editorSize.width - 100
               ? 10
               : selPosPixel.left + editorSize.width - 100
      });
    }, 0);
  }
}

iterator_traits&lt;_ForwardIterator&gt;::value_type,\n\t    typename iterator_traits&lt;_ForwardIterator&gt;::value_type&gt;)\n      __glibcxx_requires_valid_range(__first, __last);\n      __glibcxx_requires_irreflexive_pred(__first, __last, __comp);\n\n      return _GLIBCXX_STD_A::__max_element(__first, __last,\n\t\t\t\t__gnu_cxx::__ops::__iter_comp_iter(__comp));\n    }\n\n#if __cplusplus &gt;= 201402L\n  /// Reservoir sampling algorithm.\n  template&lt;typename _InputIterator, typename _RandomAccessIterator,\n           typename _Size, typename _UniformRandomBitGenerator&gt;\n    _RandomAccessIterator\n    __sample(_InputIterator __first, _InputIterator __last, input_iterator_tag,\n\t     _RandomAccessIterator __out, random_access_iterator_tag,\n\t     _Size __n, _UniformRandomBitGenerator&amp;&amp; __g)\n    {\n      using __distrib_type = uniform_int_distribution&lt;_Size&gt;;\n      using __param_type = typename __distrib_type::param_type;\n      __distrib_type __d{};\n      _Size __sample_sz = 0;\n      while (__first != __last &amp;&amp; __sample_sz != __n)\n\t{\n\t  __out[__sample_sz++] = *__first;\n\t  ++__first;\n\t}\n      for (auto __pop_sz = __sample_sz; __first != __last;\n\t  ++__first, (void) ++__pop_sz)\n\t{\n\t  const auto __k = __d(__g, __param_type{0, __pop_sz});\n\t  if (__k &lt; __n)\n\t    __out[__k] = *__first;\n\t}\n      return __out + __sample_sz;\n    }\n\n  /// Selection sampling algorithm.\n  template&lt;typename _ForwardIterator, typename _OutputIterator, typename _Cat,\n           typename _Size, typename _UniformRandomBitGenerator&gt;\n    _OutputIterator\n    __sample(_ForwardIterator __first, _ForwardIterator __last,\n\t     forward_iterator_tag,\n\t     _OutputIterator __out, _Cat,\n\t     _Size __n, _UniformRandomBitGenerator&amp;&amp; __g)\n    {\n      using __distrib_type = uniform_int_distribution&lt;_Size&gt;;\n      using __param_type = typename __distrib_type::param_type;\n      using _USize = make_unsigned_t&lt;_Size&gt;;\n      using _Gen = remove_reference_t&lt;_UniformRandomBitGenerator&gt;;\n      using __uc_type = common_type_t&lt;typename _Gen::result_type, _USize&gt;;\n\n      if (__first == __last)\n\treturn __out;\n\n      __distrib_type __d{};\n      _Size __unsampled_sz = std::distance(__first, __last);\n      __n = std::min(__n, __unsampled_sz);\n\n      // If possible, we use __gen_two_uniform_ints to efficiently produce\n      // two random numbers using a single distribution invocation:\n\n      const __uc_type __urngrange = __g.max() - __g.min();\n      if (__urngrange / __uc_type(__unsampled_sz) &gt;= __uc_type(__unsampled_sz))\n        // I.e. (__urngrange &gt;= __unsampled_sz * __unsampled_sz) but without\n\t// wrapping issues.\n        {\n\t  while (__n != 0 &amp;&amp; __unsampled_sz &gt;= 2)\n\t    {\n\t      const pair&lt;_Size, _Size&gt; __p =\n\t\t__gen_two_uniform_ints(__unsampled_sz, __unsampled_sz - 1, __g);\n\n\t      --__unsampled_sz;\n\t      if (__p.first &lt; __n)\n\t\t{\n\t\t  *__out++ = *__first;\n\t\t  --__n;\n\t\t}\n\n\t      ++__first;\n\n\t      if (__n == 0) break;\n\n\t      --__unsampled_sz;\n\t      if (__p.second &lt; __n)\n\t\t{\n\t\t  *__out++ = *__first;\n\t\t  --__n;\n\t\t}\n\n\t      ++__first;\n\t    }\n        }\n\n      // The loop above is otherwise equivalent to this one-at-a-time version:\n\n      for (; __n != 0; ++__first)\n\tif (__d(__g, __param_type{0, --__unsampled_sz}) &lt; __n)\n\t  {\n\t    *__out++ = *__first;\n\t    --__n;\n\t  }\n      return __out;\n    }\n\n#if __cplusplus &gt; 201402L\n#define __cpp_lib_sample 201603\n  /// Take a random sample from a population.\n  template&lt;typename _PopulationIterator, typename _SampleIterator,\n           typename _Distance, typename _UniformRandomBitGenerator&gt;\n    _SampleIterator\n    sample(_PopulationIterator __first, _PopulationIterator __last,\n\t   _SampleIterator __out, _Distance __n,\n\t   _UniformRandomBitGenerator&amp;&amp; __g)\n    {\n      using __pop_cat = typename\n\tstd::iterator_traits&lt;_PopulationIterator&gt;::iterator_category;\n      using __samp_cat = typename\n\tstd::iterator_traits&lt;_SampleIterator&gt;::iterator_category;\n\n      static_assert(\n\t  __or_&lt;is_convertible&lt;__pop_cat, forward_iterator_tag&gt;,\n\t\tis_convertible&lt;__samp_cat, random_access_iterator_tag&gt;&gt;::value,\n\t  &quot;output range must use a RandomAccessIterator when input range&quot;\n\t  &quot; does not meet the ForwardIterator requirements&quot;);\n\n      static_assert(is_integral&lt;_Distance&gt;::value,\n\t\t    &quot;sample size must be an integer type&quot;);\n\n      typename iterator_traits&lt;_PopulationIterator&gt;::difference_type __d = __n;\n      return _GLIBCXX_STD_A::\n\t__sample(__first, __last, __pop_cat{}, __out, __samp_cat{}, __d,\n\t\t std::forward&lt;_UniformRandomBitGenerator&gt;(__g));\n    }\n#endif // C++17\n#endif // C++14\n\n_GLIBCXX_END_NAMESPACE_ALGO\n_GLIBCXX_END_NAMESPACE_VERSION\n} // namespace std\n\n#endif /* _STL_ALGO_H */\n"}, "/usr/include/c++/9/bits/stl_iterator.h": {"id": "/usr/include/c++/9/bits/stl_iterator.h", "filePath": "/usr/include/c++/9/bits/stl_iterator.h", "content": "// Iterators -*- C++ -*-\n\n// Copyright (C) 2001-2019 Free Software Foundation, Inc.\n//\n// This file is part of the GNU ISO C++ Library.  This library is free\n// software; you can redistribute it and/or modify it under the\n// terms of the GNU General Public License as published by the\n// Free Software Foundation; either version 3, or (at your option)\n// any later version.\n\n// This library is distributed in the hope that it will be useful,\n// but WITHOUT ANY WARRANTY; without even the implied warranty of\n// MERCHANTABILITY or FITNESS FOR A PARTICULAR PURPOSE.  See the\n// GNU General Public License for more details.\n\n// Under Section 7 of GPL version 3, you are granted additional\n// permissions described in the GCC Runtime Library Exception, version\n// 3.1, as published by the Free Software Found cplusplus &gt;= 201103L\n# include &lt;type_traits&gt;\n#endif\n\n#if __cplusplus &gt;= 201703L\n# define __cpp_lib_array_constexpr 201803L\n#endif\n\nnamespace std _GLIBCXX_VISIBILITY(default)\n{\n_GLIBCXX_BEGIN_NAMESPACE_VERSION\n\n  /**\n   * @addtogroup iterators\n   * @{\n   */\n\n  // 24.4.1 Reverse iterators\n  /**\n   *  Bidirectional and random access iterators have corresponding reverse\n   *  %iterator adaptors that iterate through the data structure in the\n   *  opposite direction.  They have the same signatures as the corresponding\n   *  iterators.  The fundamental relation between a reverse %iterator and its\n   *  corresponding %iterator @c i is established by the identity:\n   *  @code\n   *      &amp;*(reverse_iterator(i)) == &amp;*(i - 1)\n   *  @endcode\n   *\n   *  &lt;em&gt;This mapping is dictated by the fact that while there is always a\n   *  pointer past the end of an array, there might not be a valid pointer\n   *  before the beginning of an array.&lt;/em&gt; [24.4.1]/1,2\n   *\n   *  Reverse iterators can be tricky and surprising at first.  Their\n   *  semantics make sense, however, and the trickiness is a side effect of\n   *  the requirement that the iterators must be safe.\n  */\n  template&lt;typename _Iterator&gt;\n    class reverse_iterator\n    : public iterator&lt;typename iterator_traits&lt;_Iterator&gt;::iterator_category,\n\t\t      typename iterator_traits&lt;_Iterator&gt;::value_type,\n\t\t      typename iterator_traits&lt;_Iterator&gt;::difference_type,\n\t\t      typename iterator_traits&lt;_Iterator&gt;::pointer,\n                      typename iterator_traits&lt;_Iterator&gt;::reference&gt;\n    {\n    protected:\n      _Iterator current;\n\n      typedef iterator_traits&lt;_Iterator&gt;\t\t__traits_type;\n\n    public:\n      typedef _Iterator\t\t\t\t\titerator_type;\n      typedef typename __traits_type::difference_type\tdifference_type;\n      typedef typename __traits_type::pointer\t\tpointer;\n      typedef typename __traits_type::reference\t\treference;\n\n      /**\n       *  The default constructor value-initializes member @p current.\n       *  If it is a pointer, that means it is zero-initialized.\n      */\n      // _GLIBCXX_RESOLVE_LIB_DEFECTS\n      // 235 No specification of default ctor for reverse_iterator\n      // 1012. reverse_iterator default ctor should value initialize\n      _GLIBCXX17_CONSTEXPR\n      reverse_iterator() : current() { }\n\n      /**\n       *  This %iterator will move in the opposite direction that @p x does.\n      */\n      explicit _GLIBCXX17_CONSTEXPR\n      reverse_iterator(iterator_type __x) : current(__x) { }\n\n      /**\n       *  The copy constructor is normal.\n      */\n      _GLIBCXX17_CONSTEXPR\n      reverse_iterator(const reverse_iterator&amp; __x)\n      : current(__x.current) { }\n\n#if __cplusplus &gt;= 201103L\n      reverse_iterator&amp; operator=(const reverse_iterator&amp;) = default;\n#endif\n\n      /**\n       *  A %reverse_iterator across other types can be copied if the\n       *  underlying %iterator can be converted to the type of @c current.\n      */\n      template&lt;typename _Iter&gt;\n\t_GLIBCXX17_CONSTEXPR\n        reverse_iterator(const reverse_iterator&lt;_Iter&gt;&amp; __x)\n\t: current(__x.base()) { }\n\n      /**\n       *  @return  @c current, the %iterator used for underlying work.\n      */\n      _GLIBCXX17_CONSTEXPR iterator_type\n      base() const\n      { return current; }\n\n      /**\n       *  @return  A reference to the value at @c --current\n       *\n       *  This requires that @c --current is dereferenceable.\n       *\n       *  @warning This implementation requires that for an iterator of the\n       *           underlying iterator type, @c x, a reference obtained by\n       *           @c *x remains valid after @c x has been modified or\n       *           destroyed. This is a bug: http://gcc.gnu.org/PR51823\n      */\n      _GLIBCXX17_CONSTEXPR reference\n      operator*() const\n      {\n\t_Iterator __tmp = current;\n\treturn *--__tmp;\n      }\n\n      /**\n       *  @return  A pointer to the value at @c --current\n       *\n       *  This requires that @c --current is dereferenceable.\n      */\n      _GLIBCXX17_CONSTEXPR pointer\n      operator-&gt;() const\n      {\n\t// _GLIBCXX_RESOLVE_LIB_DEFECTS\n\t// 1052. operator-&gt; should also support smart pointers\n\t_Iterator __tmp = current;\n\t--__tmp;\n\treturn _S_to_pointer(__tmp);\n      }\n\n      /**\n       *  @return  @c *this\n       *\n       *  Decrements the underlying iterator.\n      */\n      _GLIBCXX17_CONSTEXPR reverse_iterator&amp;\n      operator++()\n      {\n\t--current;\n\treturn *this;\n      }\n\n      /**\n       *  @return  The original value of @c *this\n       *\n       *  Decrements the underlying iterator.\n      */\n      _GLIBCXX17_CONSTEXPR reverse_iterator\n      operator++(int)\n      {\n\treverse_iterator __tmp = *this;\n\t--current;\n\treturn __tmp;\n      }\n\n      /**\n       *  @return  @c *this\n       *\n       *  Increments the underlying iterator.\n      */\n      _GLIBCXX17_CONSTEXPR reverse_iterator&amp;\n      operator--()\n      {\n\t++current;\n\treturn *this;\n      }\n\n      /**\n       *  @return  A reverse_iterator with the previous value of @c *this\n       *\n       *  Increments the underlying iterator.\n      */\n      _GLIBCXX17_CONSTEXPR reverse_iterator\n      operator--(int)\n      {\n\treverse_iterator __tmp = *this;\n\t++current;\n\treturn __tmp;\n      }\n\n      /**\n       *  @return  A reverse_iterator that refers to @c current - @a __n\n       *\n       *  The underlying iterator must be a Random Access Iterator.\n      */\n      _GLIBCXX17_CONSTEXPR reverse_iterator\n      operator+(difference_type __n) const\n      { return reverse_iterator(current - __n); }\n\n      /**\n       *  @return  *this\n       *\n       *  Moves the underlying iterator backwards @a __n steps.\n       *  The underlying iterator must be a Random Access Iterator.\n      */\n      _GLIBCXX17_CONSTEXPR reverse_iterator&amp;\n      operator+=(difference_type __n)\n      {\n\tcurrent -= __n;\n\treturn *this;\n      }\n\n      /**\n       *  @return  A reverse_iterator that refers to @c current - @a __n\n       *\n       *  The underlying iterator must be a Random Access Iterator.\n      */\n      _GLIBCXX17_CONSTEXPR reverse_iterator\n      operator-(difference_type __n) const\n      { return reverse_iterator(current + __n); }\n\n      /**\n       *  @return  *this\n       *\n       *  Moves the underlying iterator forwards @a __n steps.\n       *  The underlying iterator must be a Random Access Iterator.\n      */\n      _GLIBCXX17_CONSTEXPR reverse_iterator&amp;\n      operator-=(difference_type __n)\n      {\n\tcurrent += __n;\n\treturn *this;\n      }\n\n      /**\n       *  @return  The value at @c current - @a __n - 1\n       *\n       *  The underlying iterator must be a Random Access Iterator.\n      */\n      _GLIBCXX17_CONSTEXPR reference\n      operator[](difference_type __n) const\n      { return *(*this + __n); }\n\n    private:\n      template&lt;typename _Tp&gt;\n\tstatic _GLIBCXX17_CONSTEXPR _Tp*\n\t_S_to_pointer(_Tp* __p)\n        { return __p; }\n\n      template&lt;typename _Tp&gt;\n\tstatic _GLIBCXX17_CONSTEXPR pointer\n\t_S_to_pointer(_Tp __t)\n        { return __t.operator-&gt;(); }\n    };\n\n  ///@{\n  /**\n   *  @param  __x  A %reverse_iterator.\n   *  @param  __y  A %reverse_iterator.\n   *  @return  A simple bool.\n   *\n   *  Reverse iterators forward many operations to their underlying base()\n   *  iterators.  Others are implemented in terms of one another.\n   *\n  */\n  template&lt;typename _Iterator&gt;\n    inline _GLIBCXX17_CONSTEXPR bool\n    operator==(const reverse_iterator&lt;_Iterator&gt;&amp; __x,\n\t       const reverse_iterator&lt;_Iterator&gt;&amp; __y)\n    { return __x.base() == __y.base(); }\n\n  template&lt;typename _Iterator&gt;\n    inline _GLIBCXX17_CONSTEXPR
